<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ site.description | escape }}" />
    <title>{{ page.title | default: site.title | escape }}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f7f7f4, #121416);
        --surface: light-dark(#ffffff, #1a1d20);
        --text: light-dark(#151718, #eef1f2);
        --muted: light-dark(#5c6469, #aab2b7);
        --line: light-dark(#d9dddf, #343a3f);
        --accent: light-dark(#174c5d, #8ec7d7);
        --code: light-dark(#f0f2f2, #202428);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 96px; }
      h1 { font-size: clamp(2.2rem, 7vw, 4.8rem); line-height: .98; letter-spacing: -.045em; margin: 0 0 24px; }
      h2 { margin-top: 56px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 1.65rem; }
      h3 { margin-top: 32px; }
      a { color: var(--accent); text-underline-offset: 3px; }
      blockquote { margin: 24px 0; padding: 16px 20px; border-left: 4px solid var(--accent); background: var(--surface); }
      table { width: 100%; border-collapse: collapse; margin: 20px 0 32px; background: var(--surface); }
      th, td { border: 1px solid var(--line); padding: 11px 13px; text-align: left; vertical-align: top; }
      th { background: var(--code); }
      code { background: var(--code); padding: .12em .35em; border-radius: 4px; }
      pre { overflow-x: auto; padding: 16px; background: var(--code); border: 1px solid var(--line); border-radius: 10px; }
      pre code { background: transparent; padding: 0; }
      pre.mermaid { background: var(--surface); padding: 18px; }
      img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0 24px; }
      p, li { max-width: 82ch; }
      .site-meta { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
      @media (max-width: 700px) {
        main { width: min(100% - 20px, 1120px); padding-top: 28px; }
        table { display: block; overflow-x: auto; }
        th, td { min-width: 145px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="site-meta">Independent research/development project · technical preview</div>
      {{ content }}
    </main>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'

      const blocks = document.querySelectorAll('pre code.language-mermaid, .language-mermaid pre code')
      for (const code of blocks) {
        const pre = document.createElement('pre')
        pre.className = 'mermaid'
        pre.textContent = code.textContent ?? ''
        const container = code.closest('.language-mermaid') ?? code.parentElement
        container?.replaceWith(pre)
      }

      mermaid.initialize({ startOnLoad: true, securityLevel: 'strict', theme: 'neutral' })
    </script>
  </body>
</html>
