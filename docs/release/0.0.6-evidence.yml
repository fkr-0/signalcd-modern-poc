known_limitations:
  pwa_install_ui:
    status: manual_device_smoke_pending
    detail: desktop install chrome and Safari/iOS Add to Home Screen are outside the headless test harness
  webkit_true_offline_navigation:
    status: automation_tool_limitation
    detail: Playwright WebKit context.setOffline plus service-worker navigation fails inside the engine before application code runs
  first_time_offline_identity:
    status: not_supported_for_remote_capability
    detail: local restoration is offline-capable after provisioning; first-time remote-capable identity registration still requires the configured identity provider
  real_signal:
    status: pending_external_validation
    skipped_test: apps/sidecar/src/real-signal.smoke.test.ts
  peerjs_all_peers_offline:
    status: not_signal_equivalent
  bundle_size:
    status: advisory_warning
    detail: Vite reports the main minified JavaScript chunk at approximately 598.35 kB
  working_tree:
    status: dirty_by_design
    detail: >-
      Candidate changes are not committed because the checkout contains inherited
      unrelated/pre-existing work. A release tag must not be created until the
      intended release diff is isolated and committed to an exact revision.

publication:
  local_commit: not_requested
  local_tag: not_created
  push: not_requested
  github_release: not_requested
  deploy: not_requested
  safe_next_gate: >-
    Run the physical Safari/iOS install smoke if required, isolate the intended
    0.0.6 release diff from inherited dirty work, create a release commit, then
    tag that exact commit only with explicit operator authorization.
