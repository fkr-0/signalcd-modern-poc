release:
  project: SignalCD Modern PoC
  repository: fkr-0/signalcd-modern-poc
  version: 0.0.5
  proposed_tag: v0.0.5
  tag_kind: annotated
  tag_created: true
  tag_pushed: false
  channel: technical-preview
  branch: ci/webkit-diagnose
  base_revision_before_candidate: b7f88596ea1819d7a7faa6d1a7dcfc480106b7aa
  protocol_envelope: v1

scope:
  included:
    - additive structured Automerge block/list/comment/attachment-metadata operations exposed through DocumentSession
    - bounded configurable automatic retry scheduling above durable outbound state without redefining transport handoff as peer acknowledgement
    - non-consuming stable remote identity metadata lookup while encryption continues to consume fresh one-time X25519 prekeys
    - Android M1 canonical TypeScript/JVM Automerge bootstrap and cross-runtime fixture coverage
    - Android two-native-session incremental convergence and file-backed Room close/reopen continuation evidence
    - reconciled roadmap plus getting-started, ADR, and desktop-feasibility documentation
    - synchronized 0.0.5 workspace and Android application version metadata
  protected_inherited_files_excluded_from_release_commit:
    - apps/android/core/protocol/src/main/kotlin/dev/e2ecol/android/protocol/ProtocolEnvelope.kt
    - apps/android/core/protocol/src/test/kotlin/dev/e2ecol/android/protocol/EnvelopeKindTest.kt
    - apps/android/core/protocol/src/test/kotlin/dev/e2ecol/android/protocol/ProtocolEnvelopeCodecTest.kt
    - docs/android-integration.md
    - packages/protocol/src/protocol.test.ts
  explicitly_not_claimed:
    - authenticated long-term Ed25519 identity-key rebind or silent directory key replacement
    - Android native E2EE/Keystore parity or Compose shared-document send wiring
    - a desktop runtime/scaffold before host/security/lifecycle contract ratification
    - iOS implementation
    - production-ready security
    - real two-account Signal qualification
    - Signal-equivalent durability when all PeerJS participants are offline
    - TURN-required PeerJS deployment qualification

