# extend.yml — Mock-Identity E2EE Collaboration Feature Specification
#
# Status: draft design specification
# Target: e2e-col development-mode full-stack mock
# Date: 2026-08-20
#
# This file specifies the architecture for a development-mode mock Signal
# infrastructure that enables end-to-end encrypted collaborative editing
# without requiring a real Signal account or network. It covers identity
# provisioning, key management, document access control, session lifecycle,
# synchronization modes, and transparent wire logging.
#
# The design ensures a clean separation: swap the mock backend for real
# signal-cli at production time without changing browser application code.

