name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/protocol/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Assemble debug APK
        run: apps/android/gradlew -p apps/android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  assemble-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Assemble release APK
        run: apps/android/gradlew -p apps/android :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
