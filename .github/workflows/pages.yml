name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'typedoc.json'
      - 'tsconfig.api-docs.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate TypeDoc API reference
        run: pnpm run api:docs

      - uses: actions/configure-pages@v5

      - name: Build Jekyll documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Add generated API docs to site
        run: |
          # jekyll-build-pages runs in a container and leaves _site root-owned.
          # Reclaim only the generated site tree before composing TypeDoc into it.
          sudo chown -R "$(id -u):$(id -g)" _site
          rm -rf _site/api
          mkdir -p _site/api
          cp -R build/api-docs/. _site/api/

      # This is a separate browser-only room, NOT the production SignalCD
      # identity/group-authority app. It uses the tested PeerJsTransport and
      # Automerge substrate with an invitation-derived AES-GCM room key.
      - name: Build standalone PeerJS/WebRTC browser demo
        run: |
          pnpm --filter @e2e-col/web exec vite build --config vite.peerjs-demo.config.ts
          mv apps/web/build/peerjs-demo/peerjs-demo.html apps/web/build/peerjs-demo/index.html

      - name: Add browser demo to Pages artifact
        run: |
          mkdir -p _site/peerjs
          cp -R apps/web/build/peerjs-demo/. _site/peerjs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
