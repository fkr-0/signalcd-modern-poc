name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/protocol/**'
      - '.github/workflows/android-test.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run core module tests
        run: apps/android/gradlew -p apps/android :core:model:test :core:protocol:test :core:sidecar:test

      - name: Run identity and storage tests
        run: apps/android/gradlew -p apps/android :core:identity:test :core:storage:test

      - name: Run session tests
        run: apps/android/gradlew -p apps/android :core:session:test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run lint
        run: apps/android/gradlew -p apps/android :app:lintDebug
        continue-on-error: true
