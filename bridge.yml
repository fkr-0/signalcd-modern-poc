version: 1
name: e2e-col
description: Exploration and modernization of signal-based collaborative documents concepts.
default_track: local
shell: true
sync_dir:
  - .

agent:
  notes: |
    Project created by ws-bridge create_project. Keep bridge.yml commands runnable from the project root.
  tasks: []
  changelog:
    - Initialized project scaffold.

commands:
  dev:
    description: Run the development entrypoint
    category: dev
    cwd: .
    run: ['pnpm', 'run', 'dev']

  test:
    description: Run tests
    category: test
    cwd: .
    run: ['pnpm', 'run', 'test']

  build:
    description: Run the build command
    category: build
    cwd: .
    run: ['pnpm', 'run', 'build']

  typecheck:
    description: Typecheck all workspaces
    category: lint
    cwd: .
    run: ['pnpm', 'run', 'typecheck']

  lint:
    description: Lint the monorepo
    category: lint
    cwd: .
    run: ['pnpm', 'run', 'lint']

  check:
    description: Run the full non-browser verification gate
    category: test
    cwd: .
    run: ['pnpm', 'run', 'check']

  e2e:
    description: Run browser end-to-end tests
    category: test
    cwd: .
    run: ['pnpm', 'run', 'test:e2e']

  version-check:
    description: Validate SemVer and synchronized workspace versions
    category: lint
    cwd: .
    run: ['pnpm', 'run', 'version:check']

  release-check:
    description: Run the full release verification gate including browser E2E
    category: test
    cwd: .
    run: ['pnpm', 'run', 'check:release']

  android-check:
    description: Run Android JVM compatibility and sidecar tests
    category: test
    cwd: .
    run: ['pnpm', 'run', 'android:check']

  android-assemble:
    description: Assemble the Android debug application
    category: build
    cwd: .
    run: ['pnpm', 'run', 'android:assemble']

agent_workflow:
  version: '1.0'
  project:
    id: e2e-col
    title: e2e-col
    root: .
    capacity:
      max_active_workers: 4
      max_reserved_packets: 8
      max_reviewers: 2
  defaults:
    queue: managed
    lease_policy: normal
    mutation_policy: transactional
    review_policy: independent-review
    priority: 50
  lease_policies:
    normal: {}
  mutation_policies:
    transactional:
      mode: transaction-required
      stale_write_protection: sha256
      capture_preimage: true
      rollback_on_partial_failure: true
  review_policies:
    independent-review:
      mode: required
      reviewer:
        independent: true
        allow_author: false
        allow_mutation: false
      max_rounds: 2
      on_timeout: blocked
  queues:
    managed:
      title: Managed work
      capacity: 4
  opportunities: []
  governance:
    strict_validation: true
    reject_unknown_fields: true
    overrides:
      allow_less_restrictive_mutation_policy: false
      allow_review_bypass: false
      allow_scope_expansion_at_runtime: false
    recovery:
      allow_dirty_requeue: false
    derived_opportunities:
      promotion: operator_gate
